name: CI

# Nur noch main, nicht mehr jeder Branch. Die Projektkonvention verlangt
# ohnehin, vor dem Merge alle zehn Envs lokal zu bauen und die Hosttests laufen
# zu lassen - die CI ist damit Rueckversicherung, nicht Erstpruefung. Ihr Zweck
# bleibt das Absichern der ESP8266-Rueckfallebene, und die steht in main.
# workflow_dispatch bleibt, damit ein Branch bei Bedarf trotzdem gezielt durch
# die CI geschickt werden kann, ohne diese Datei anzufassen (Actions -> CI ->
# Run workflow -> Branch waehlen).
# pull_request ist absichtlich raus: hier wird lokal gemergt, der Trigger lief
# praktisch nie.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # Cache für Toolchains und Bibliotheken (ESP8266 + ESP32, 1163 MB).
      #
      # WARUM er hier steht - nicht wegen der Laufzeit. Am 2026-08-12 gemessen,
      # Lauf #6 (kalt) gegen #7 (warm) bei identischem Code: Job ~287 s -> ~246 s,
      # also gut 40 s von rund vier Minuten, und davon ist ein Teil Streuung des
      # Runners (pip allein schwankte um 11 s). Der Hauptposten sind die ~220 s
      # Kompilierzeit für zehn Envs, die der Cache nicht berührt; das
      # Wiederherstellen der 1163 MB kostet umgekehrt selbst 11 s.
      # Der Cache bleibt, weil er die CI von den Espressif-Downloadservern
      # unabhängig macht: sind die nicht erreichbar, läuft sie trotzdem durch.
      # Für eine CI, deren Zweck das Absichern der ESP8266-Rückfallebene ist,
      # wiegt das mehr als eine halbe Minute.
      #
      # Der Schlüssel hängt an platformio.ini, weil dort steht, welche
      # Plattformen und Bibliotheken gebraucht werden. Zwei Folgen davon:
      # - Die Plattformen sind dort NICHT auf eine Version gepinnt, ein
      #   Toolchain-Update erreicht die CI also erst mit der nächsten Änderung
      #   an platformio.ini.
      # - Bei GitHubs Grenze von 10 GB je Repository passen rund acht solcher
      #   Einträge; ältere verdrängt GitHub selbst.
      - name: PlatformIO-Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: PlatformIO installieren
        run: pip install --upgrade platformio

      # Die echte platformio_user_env.ini ist nicht in git (Ports, IPs, OTA-
      # Passwort). Für einen Build genügt die Vorlage: sie enthält alle
      # Sektionen, die platformio.ini über ${...} referenziert - nur die
      # Upload-Ziele darin sind Platzhalter, und die braucht ein Build nicht.
      - name: Upload-Ziele aus der Vorlage bereitstellen
        run: cp platformio_user_env_sample.ini platformio_user_env.ini

      # Hosttests ohne Hardware. Alle prüfen ihre Ergebnisse seit 3.6.0 selbst
      # und geben bei gebrochener Zusicherung != 0 zurück - der Schritt fängt
      # also nicht mehr nur Übersetzungsfehler und Abstürze ab.
      #
      # merge_test:      Merge-Logik der Set-Kommandos (Masken, Umrechnung)
      # telegramm_test:  Typ-, Längen- und Prüfsummenregel für das
      #                  Antworttelegramm - bindet src/telegram.h direkt ein,
      #                  prüft also den Code, der auf dem Gerät läuft
      # sendwindow_test: Zeitregeln des Kommando-Sammelfensters aus 3.8.0,
      #                  bindet src/sendwindow.h direkt ein. Deckt als einziger
      #                  den millis()-Überlauf nach 49,7 Tagen ab - an der
      #                  Anlage wäre der nicht abzuwarten.
      # byte28_test:     Kodierung von SET35/SET36 auf Byte 28 - legt die
      #                  Merge-Logik aus commands.cpp und die Dekodierer aus
      #                  decode.cpp nebeneinander. Byte 28 trägt zwei Bitfelder;
      #                  ohne bitgenaue Maske schaltet ein Kühl-Kommando die
      #                  Heizung mit um, und genau das prüft die Gegenprobe.
      # notbetrieb_test: Regeln des Notbetriebs aus 3.12.0 - Vollständigkeit
      #                  der gehaltenen Werte, Bereichsgrenzen (verwerfen statt
      #                  klemmen), die Karenzzeit-Ausnahme für den
      #                  notbetrieb-Zweig und der Zustandsautomat samt
      #                  millis()-Überlauf. Die Karenz-Ausnahme ist der Grund,
      #                  warum dieser Test in der CI steht: wird sie vergessen,
      #                  funktioniert der Knopf im Labor und nach jedem Neustart
      #                  nicht mehr - auffallen würde das erst im Ernstfall.
      # byte110_test:    Bitzuordnung der vier Ist-Zustands-Topics (TOP99-102);
      #                  übersetzt src/decode.cpp mit, deshalb über das Skript
      #                  (Arduino-Ersatzheader aus test/stubs/)
      - name: Hosttests übersetzen und ausführen
        run: |
          c++ -std=c++17 -O2 -Wall -o /tmp/merge_test test/merge_test.cpp
          /tmp/merge_test
          c++ -std=c++17 -O2 -Wall -o /tmp/telegramm_test test/telegramm_test.cpp
          /tmp/telegramm_test
          c++ -std=c++17 -O2 -Wall -o /tmp/sendwindow_test test/sendwindow_test.cpp
          /tmp/sendwindow_test
          c++ -std=c++17 -O2 -Wall -o /tmp/byte28_test test/byte28_test.cpp
          /tmp/byte28_test
          c++ -std=c++17 -O2 -Wall -o /tmp/notbetrieb_test test/notbetrieb_test.cpp
          /tmp/notbetrieb_test
          ./test/decode_hosttest.sh

      # Alle Envs bauen, nicht nur default_envs (= heishamon_esp32_h1_ota).
      # Sonst bleibt die ESP8266-Rückfallebene ungebaut und könnte unbemerkt
      # kaputtgehen - auffallen würde das erst, wenn man sie im Notfall braucht.
      # Die Liste kommt aus platformio.ini selbst: neue Envs werden dadurch
      # automatisch mitgebaut, und es gibt keine zweite Liste, die hinter der
      # ersten zurückbleiben kann.
      - name: Alle Envs bauen
        run: |
          envs=$(pio project config --json-output \
            | python3 -c "import json,sys; print(' '.join('-e '+s[0][4:] for s in json.load(sys.stdin) if s[0].startswith('env:')))")
          echo "Baue: $envs"
          pio run $envs
