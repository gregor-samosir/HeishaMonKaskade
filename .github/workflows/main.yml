name: CI

# Nur noch main, nicht mehr jeder Branch. Die Projektkonvention verlangt
# ohnehin, vor dem Merge alle sechs Envs lokal zu bauen und die Hosttests laufen
# zu lassen - die CI ist damit Rueckversicherung, nicht Erstpruefung. Ihr Zweck
# ist seit 3.16.0 (Wegfall der ESP8266-Rueckfallebene) das, was beim lokalen
# Bauen am ehesten uebergangen wird: die Envs der jeweils ANDEREN Stufe und die
# beiden Test-Envs. Wer an H1 arbeitet, baut selten H2 mit.
# workflow_dispatch bleibt, damit ein Branch bei Bedarf trotzdem gezielt durch
# die CI geschickt werden kann, ohne diese Datei anzufassen (Actions -> CI ->
# Run workflow -> Branch waehlen).
# pull_request ist absichtlich raus: hier wird lokal gemergt, der Trigger lief
# praktisch nie.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # Cache für Toolchains und Bibliotheken.
      #
      # WARUM er hier steht - nicht wegen der Laufzeit. Am 2026-08-12 gemessen,
      # Lauf #6 (kalt) gegen #7 (warm) bei identischem Code und dem damaligen
      # Stand von zehn Envs: Job ~287 s -> ~246 s, also gut 40 s von rund vier
      # Minuten, und davon ist ein Teil Streuung des Runners (pip allein
      # schwankte um 11 s). Der Hauptposten war die Kompilierzeit, die der Cache
      # nicht berührt; das Wiederherstellen der 1163 MB kostete umgekehrt selbst
      # 11 s.
      # Der Cache bleibt, weil er die CI von den Espressif-Downloadservern
      # unabhängig macht: sind die nicht erreichbar, läuft sie trotzdem durch.
      # Das wiegt mehr als eine halbe Minute - eine Rückversicherung, die nur
      # läuft, wenn ein fremder Server antwortet, ist keine.
      #
      # NACHGEMESSEN AM 2026-08-27, erster Lauf der 3.16.0 (sechs statt zehn
      # Envs): Job 3:23 min gegen 4:15 min am 2026-08-25. Die Cachegröße blieb
      # dagegen bei 1163 MB - NICHT kleiner, wie beim Planen erwartet.
      #
      # Der Grund steht zwei Zeilen tiefer: restore-keys. Der Schlüssel hängt an
      # platformio.ini, die sich geändert hat - also gab es keinen Volltreffer,
      # und der Präfix-Treffer stellte den ALTEN Cache samt espressif8266-
      # Toolchain wieder her. Am Jobende wird dann genau dieser Inhalt unter dem
      # neuen Schlüssel abgelegt. Der Ballast wandert also mit, statt zu
      # verschwinden. Er verschwindet erst, wenn kein passender älterer Eintrag
      # mehr existiert (GitHub räumt nach 7 Tagen ohne Zugriff auf) oder wenn
      # jemand die pio-Einträge von Hand löscht: Actions -> Caches. Der erste
      # Lauf danach ist kalt, und der Cache enthält anschließend nur noch den
      # ESP32-Anteil.
      #
      # restore-keys bleibt trotzdem stehen: Ein Präfix-Treffer mit veraltetem
      # Inhalt ist immer noch besser als ein Lauf, der von den Espressif-Servern
      # abhängt - und genau dafür ist der Cache da.
      #
      # Der Schlüssel hängt an platformio.ini, weil dort steht, welche
      # Plattformen und Bibliotheken gebraucht werden. Zwei Folgen davon:
      # - Die Plattform ist seit 2026-09-13 auf ein festes pioarduino-Release
      #   gepinnt. Ein Plattform-Update ist damit immer eine Änderung an
      #   platformio.ini und bekommt einen neuen Cache-Schlüssel. Vorher stand
      #   dort nur "espressif32", und die CI zog damit das offizielle
      #   espressif32 7.0.1 (Core 2.0.17), während der Entwicklungsrechner
      #   pioarduino 55.3.311 (Core 3.3.11) nahm - die CI prüfte also eine
      #   andere Firmware als die geflashte. Die Bibliotheken installiert die
      #   CI bei jedem Lauf neu aus den ^-Bereichen; am 2026-09-13 stimmten sie
      #   mit dem Entwicklungsrechner überein.
      # - Bei GitHubs Grenze von 10 GB je Repository passen rund acht solcher
      #   Einträge; ältere verdrängt GitHub selbst.
      - name: PlatformIO-Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: PlatformIO installieren
        run: pip install --upgrade platformio

      # Die echte platformio_user_env.ini ist nicht in git (Ports, IPs, OTA-
      # Passwort). Für einen Build genügt die Vorlage: sie enthält alle
      # Sektionen, die platformio.ini über ${...} referenziert - nur die
      # Upload-Ziele darin sind Platzhalter, und die braucht ein Build nicht.
      - name: Upload-Ziele aus der Vorlage bereitstellen
        run: cp platformio_user_env_sample.ini platformio_user_env.ini

      # Hosttests ohne Hardware. Die Liste samt Begruendung je Test steht in
      # test/hosttests.sh - nicht mehr hier. Lokal vor dem Merge laeuft genau
      # dasselbe Skript; eine zweite Liste, die hinter der ersten zurueckbleibt,
      # gibt es damit nicht. Das Skript bricht auch ab, wenn eine
      # test/*_test.cpp nicht in seiner Liste steht.
      - name: Hosttests übersetzen und ausführen
        run: ./test/hosttests.sh

      # Alle Envs bauen, nicht nur default_envs (= heishamon_esp32_h1_ota).
      # Sonst bleiben die Envs der anderen Stufe und die beiden Test-Envs
      # ungebaut und könnten unbemerkt kaputtgehen - auffallen würde das erst
      # beim naechsten Rollout auf H2 oder beim naechsten Pruefstandslauf, also
      # genau dann, wenn man sie braucht.
      # Die Liste kommt aus platformio.ini selbst: neue Envs werden dadurch
      # automatisch mitgebaut, und es gibt keine zweite Liste, die hinter der
      # ersten zurückbleiben kann.
      - name: Alle Envs bauen
        run: |
          envs=$(pio project config --json-output \
            | python3 -c "import json,sys; print(' '.join('-e '+s[0][4:] for s in json.load(sys.stdin) if s[0].startswith('env:')))")
          echo "Baue: $envs"
          pio run $envs
