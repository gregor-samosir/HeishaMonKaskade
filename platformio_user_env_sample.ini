; ============================================================================
; Vorlage fuer platformio_user_env.ini (diese Datei liegt nicht in git):
;
;   cp platformio_user_env_sample.ini platformio_user_env.ini
;
; Hier stehen nur Ports, IP-Adressen und das OTA-Passwort. Was gebaut wird,
; steht in platformio.ini. Alle Sektionen muessen vorhanden sein, auch wenn
; nur ein Board benutzt wird - platformio.ini referenziert sie alle.
;
;   [usb_defaults]        D1 mini      am USB
;   [ota_defaults_h1/_h2] D1 mini      im Netz
;   [usb32_defaults]      ESP32-S3     am USB
;   [ota32_defaults_*]    ESP32-S3     im Netz
;   [ap_defaults]         Passwort des Setup-Hotspots (alle Boards)
; ============================================================================


; --------------------------- D1 mini (ESP8266) ------------------------------
[usb_defaults]
upload_port             = /dev/cu.wchusbserial1430
upload_protocol         = esptool
upload_speed            = 115200
upload_resetmethod      = nodemcu

[ota_defaults_h1]
upload_port             = 192.168.2.108
upload_protocol         = espota
upload_flags            = --auth=heisha

[ota_defaults_h2]
upload_port             = 192.168.2.193
upload_protocol         = espota
upload_flags            = --auth=heisha


; --------------------------- ESP32-S3-Board ---------------------------------
; USB-CDC meldet sich als usbmodem; die Portnummer kann sich je nach
; USB-Buchse aendern. Keine upload_speed setzen - esptool waehlt selbst.
[usb32_defaults]
upload_port             = /dev/cu.usbmodem11101
upload_protocol         = esptool

; Stufe 1 an WP1 - feste IP im Router reservieren
[ota32_defaults_h1]
upload_port             = 192.168.2.120
upload_protocol         = espota
upload_flags            = --auth=heisha

; Stufe 2 an WP2 - feste IP im Router reservieren
[ota32_defaults_h2]
upload_port             = 192.168.2.122
upload_protocol         = espota
upload_flags            = --auth=heisha

; Testgeraet - per mDNS-Namen, unabhaengig von der DHCP-IP
[ota32_defaults_test]
upload_port             = heishamon32.local
upload_protocol         = espota
upload_flags            = --auth=heisha


; --------------------------- Setup-Hotspot (WPA2) ---------------------------
; Passwort des Konfigurations-AP "HeishaMon-Setup". Beide Board-Basen in
; platformio.ini binden diese Sektion ein, das Flag gilt also fuer alle Envs.
; Mindestens 8, hoechstens 63 Zeichen (WPA2) - der Build prueft das per
; static_assert. Nur Buchstaben und Ziffern verwenden, sonst muss beim Quoten
; aufgepasst werden. Das Passwort gehoert in die Notfall-Unterlage der Familie:
; ohne es kommt niemand mehr ins Portal, wenn das WLAN ausfaellt.
[ap_defaults]
build_flags = -D HEISHA_AP_PASSWORD='"BitteAendern123"'
