; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = src
build_dir = .pioenvs
build_cache_dir = .cache
default_envs = d1_mini_h1_ota
extra_configs = platformio_user_env.ini

; Gemeinsame Basis fuer alle Envs - die env:-Sektionen unten ergaenzen nur
; noch ihre Upload-Einstellungen (USB bzw. OTA aus platformio_user_env.ini)
[env]
platform = espressif8266
board = d1_mini
framework = arduino
build_flags = ${esp82xx_defaults.build_flags}
build_unflags = -Wall
monitor_speed = 115200
check_tool = clangtidy
check_flags = clangtidy: --checks=-*,cert-*,clang-analyzer-* --fix
board_build.filesystem = littlefs
board_build.flash_mode = dout
extra_scripts = ${scripts_defaults.extra_scripts}
lib_deps =
	knolleary/PubSubClient@^2.8
	; bewusst 6.x: ArduinoJson 7 ist fuer den ESP8266 nicht empfohlen (Footprint)
	bblanchon/ArduinoJson@^6.21.5
	jandrassy/TelnetStream@^1.2.1
	paulstoffregen/Time@^1.6
	tzapu/WiFiManager@^2.0.17
	sstaub/Ticker

[env:d1_mini_usb]
upload_resetmethod = ${usb_defaults.upload_resetmethod}
upload_speed = ${usb_defaults.upload_speed}
upload_protocol = ${usb_defaults.upload_protocol}
upload_port = ${usb_defaults.upload_port}

; Offizielles HeishaMon-ESP32-S3-Board (WP an Serial1 RX18/TX17, USB-CDC-Konsole).
; Test-Konfiguration mit eigenem Prefix - fuer den H1-Ersatz spaeter die
; H1-Build-Flags uebernehmen.
[env:heishamon_esp32_usb]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.filesystem = littlefs
board_build.flash_mode = dio
; Board hat 4 MB Flash (nicht 8 wie die devkitc-1-Definition annimmt);
; min_spiffs: 2x 1,9 MB OTA-Slots + 192 KB LittleFS fuer config.json
board_upload.flash_size = 4MB
board_build.partitions = min_spiffs.csv
build_flags =
	-D NDEBUG
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D ARDUINO_USB_MODE=1
	-D HEISHA_MQTT_PREFIX='"panasonic_heat_pump32"'
	-D HEISHA_STAGE_NAME='"Heisha ESP32 Test"'
	-D HEISHA_HOSTNAME='"HeishaMon32"'
upload_protocol = esptool
upload_port = /dev/cu.usbmodem11101
monitor_speed = 115200

; OTA-Variante desselben Envs - fuer Updates, wenn das Board an der WP haengt
; (Erreichbarkeit ueber mDNS-Namen, unabhaengig von der DHCP-IP)
[env:heishamon_esp32_ota]
extends = env:heishamon_esp32_usb
upload_protocol = espota
upload_port = heishamon32.local
upload_flags = --auth=heisha

; Produktiv-Env: das ESP32-Board als Stufe 1 an WP1 (ersetzt den D1 mini H1).
; Gleiche Stufen-Flags wie d1_mini_h1_ota, feste IP im Router reserviert.
[env:heishamon_esp32_h1_ota]
extends = env:heishamon_esp32_usb
build_flags =
	-D NDEBUG
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D ARDUINO_USB_MODE=1
	-D HEISHA_MQTT_PREFIX='"panasonic_heat_pump"'
	-D HEISHA_STAGE_NAME='"Heisha Stufe 1"'
	-D HEISHA_HOSTNAME='"HeishaMon32_h1"'
upload_protocol = espota
upload_port = 192.168.2.120
upload_flags = --auth=heisha

; Stufen-spezifische Werte (MQTT-Prefix, Web-Titel, Hostname) kommen als
; Build-Flags - kein Code-Anpassen mehr beim Wechsel zwischen H1 und H2.
; Ohne Flags gelten die Stufe-1-Fallbacks im Code (gilt z. B. fuer d1_mini_usb).
[env:d1_mini_h1_ota]
build_flags = ${env.build_flags}
	-D HEISHA_MQTT_PREFIX='"panasonic_heat_pump"'
	-D HEISHA_STAGE_NAME='"Heisha Stufe 1"'
	-D HEISHA_HOSTNAME='"HeishaMon"'
upload_protocol = ${ota_defaults_h1.upload_protocol}
upload_flags = ${ota_defaults_h1.upload_flags}
upload_port = ${ota_defaults_h1.upload_port}

[env:d1_mini_h2_ota]
build_flags = ${env.build_flags}
	-D HEISHA_MQTT_PREFIX='"panasonic_heat_pump2"'
	-D HEISHA_STAGE_NAME='"Heisha Stufe 2"'
	-D HEISHA_HOSTNAME='"HeishaMon2"'
upload_protocol = ${ota_defaults_h2.upload_protocol}
upload_flags = ${ota_defaults_h2.upload_flags}
upload_port = ${ota_defaults_h2.upload_port}

[scripts_defaults]
extra_scripts = piotools/name-firmware.py

[esp82xx_defaults]
build_flags =
	-D NDEBUG
	-Wl,-Map,firmware.map
	-D SERIAL_BUFFER_SIZE=256
;	-D MMU_IRAM_SIZE=0x8000
;	-D MMU_ICACHE_SIZE=0x4000
;	-D MMU_SEC_HEAP=0x40108000
;	-D MMU_SEC_HEAP_SIZE=0x4000
