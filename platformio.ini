; ============================================================================
; HeishaMon Kaskade - PlatformIO Projektkonfiguration
;
; Aufbau dieser Datei:
;   1. Projekt-Grundeinstellungen  [platformio]
;   2. Gemeinsame Basis aller Envs [env]
;   3. Baustein: Board-Basis       [esp32_base]
;   4. Bausteine: Stufen-Identitaet[stage_h1] [stage_h2] [stage_test_esp32]
;   5. PRODUKTIV  (Update per OTA) *_h1_ota / *_h2_ota
;   6. ERSTSETUP  (Flash per USB)  *_usb
;   7. TEST       (Pruefstand)     heishamon_esp32_usb/_ota
;
; Geraetespezifische Ports, IP-Adressen und Passwoerter stehen NICHT hier,
; sondern in platformio_user_env.ini (nicht in git, Vorlage:
; platformio_user_env_sample.ini). Diese Datei referenziert sie nur ueber
; ${usb32_defaults.*}, ${ota32_defaults_*.*}, ${ap_defaults.build_flags}
; (Setup-AP, seit 3.8.1) und ${notbetrieb_defaults.build_flags} (Zugang zum
; Notbetriebsknopf, seit 3.12.0).
;
; Doku: https://docs.platformio.org/page/projectconf.html
; ============================================================================


; ----------------------------------------------------------------------------
; 1. Projekt-Grundeinstellungen
; ----------------------------------------------------------------------------
[platformio]
src_dir = src
build_dir = .pioenvs
build_cache_dir = .cache
; Standard-Env fuer "pio run" ohne -e: das produktive ESP32-Board an WP1.
; ACHTUNG: "pio run -t upload" ohne -e flasht damit direkt die laufende WP1.
default_envs = heishamon_esp32_h1_ota
extra_configs = platformio_user_env.ini


; ----------------------------------------------------------------------------
; 2. Gemeinsame Basis aller Envs
;    Nur das, was von Board und Stufe unabhaengig ist. Alles Board-Abhaengige
;    (platform, board, build_flags, flash_mode) steht in der Board-Basis unter
;    Punkt 3 - so gibt es keine stillen Ueberschreibungen.
; ----------------------------------------------------------------------------
[env]
framework = arduino
monitor_speed = 115200
build_unflags = -Wall
board_build.filesystem = littlefs
extra_scripts = piotools/name-firmware.py
check_tool = clangtidy
check_flags = clangtidy: --checks=-*,cert-*,clang-analyzer-* --fix
lib_deps =
	knolleary/PubSubClient@^2.8
	; bewusst 6.x: ArduinoJson 7 ist fuer den ESP8266 nicht empfohlen (Footprint)
	bblanchon/ArduinoJson@^6.21.5
	jandrassy/TelnetStream@^1.2.1
	paulstoffregen/Time@^1.6
	tzapu/WiFiManager@^2.0.17
	sstaub/Ticker


; ----------------------------------------------------------------------------
; 3. Baustein: Board-Basis
;    Jedes Env erbt sie per "extends". Sie bindet
;    ${ap_defaults.build_flags} und ${notbetrieb_defaults.build_flags} ein -
;    das WPA2-Passwort des Setup-Hotspots und der Zugang zum Notbetriebsknopf
;    kommen aus platformio_user_env.ini und duerfen nicht in git landen. Ohne
;    die Sektionen faellt der Code auf bekannte Fallbacks zurueck und der Build
;    gibt eine Warnung aus (src/webfunctions.cpp bzw. src/HeishaMon.cpp).
; ----------------------------------------------------------------------------

; Offizielles HeishaMon-ESP32-S3-Board (WP an Serial1 RX18/TX17, USB-CDC-Konsole)
[esp32_base]
platform = espressif32
board = esp32-s3-devkitc-1
board_build.flash_mode = dio
; Board hat 4 MB Flash (nicht 8 wie die devkitc-1-Definition annimmt);
; min_spiffs: 2x 1,9 MB OTA-Slots + 192 KB LittleFS fuer config.json
board_upload.flash_size = 4MB
board_build.partitions = min_spiffs.csv
build_flags =
	${ap_defaults.build_flags}
	${notbetrieb_defaults.build_flags}
	-D NDEBUG
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D ARDUINO_USB_MODE=1


; ----------------------------------------------------------------------------
; 4. Bausteine: Stufen-Identitaet
;    MQTT-Prefix und Web-Titel der Kaskadenstufe - kein Code-Anpassen mehr beim
;    Wechsel zwischen H1 und H2. Jedes Env bindet genau einen der drei
;    Bausteine ein; die Stufe-1-Fallbacks aus Topics.cpp sind damit nur noch
;    Absicherung gegen ein vergessenes Flag.
;    Der Hostname steht bewusst NICHT hier: Mehrere Boards koennen dieselbe
;    Stufe fahren - das Backup-Board einer Stufe traegt denselben Build, aber
;    den Hostnamen HeishaMon32_h1b bzw. _h2b (siehe Ablauf-Backup-Boards.md).
;
;    NOTBETRIEB_ROLLE_HEIZEN / _WASSER bestimmen, welchen Knopf die Weboberflaeche
;    anbietet und welche Werte die Stufe im Notbetriebszweig entgegennimmt
;    (Stufe 1 heizt nach Kurve, Stufe 2 macht Warmwasser). Nur _WASSER wird
;    ausgewertet, _HEIZEN steht der Lesbarkeit halber daneben - ohne Flag gilt
;    Heizen, derselbe Fallback wie beim Prefix. Die Testgeraete bekommen bewusst
;    KEINE Rolle: Sie fahren damit die Heizen-Variante, die mehr Schritte und
;    mehr Werte hat und deshalb der schaerfere Pruefling ist.
; ----------------------------------------------------------------------------

[stage_h1]
build_flags =
	-D HEISHA_MQTT_PREFIX='"panasonic_heat_pump"'
	-D HEISHA_STAGE_NAME='"Heisha Stufe 1"'
	-D NOTBETRIEB_ROLLE_HEIZEN

[stage_h2]
build_flags =
	-D HEISHA_MQTT_PREFIX='"panasonic_heat_pump2"'
	-D HEISHA_STAGE_NAME='"Heisha Stufe 2"'
	-D NOTBETRIEB_ROLLE_WASSER

; Testgeraete: eigenes Prefix ist PFLICHT, sonst sitzt der Pruefling auf dem
; LWT- und state-Pfad der produktiven WP1.
[stage_test_esp32]
build_flags =
	-D HEISHA_MQTT_PREFIX='"panasonic_heat_pump32"'
	-D HEISHA_STAGE_NAME='"Heisha ESP32 Test"'


; ============================================================================
; 5. PRODUKTIV - Update per OTA, Geraet haengt an der Waermepumpe
; ============================================================================

; ESP32-S3 als Stufe 1 an WP1
[env:heishamon_esp32_h1_ota]
extends = esp32_base
build_flags =
	${esp32_base.build_flags}
	${stage_h1.build_flags}
	-D HEISHA_HOSTNAME='"HeishaMon32_h1"'
upload_protocol = ${ota32_defaults_h1.upload_protocol}
upload_port = ${ota32_defaults_h1.upload_port}
upload_flags = ${ota32_defaults_h1.upload_flags}

; ESP32-S3 als Stufe 2 an WP2
[env:heishamon_esp32_h2_ota]
extends = esp32_base
build_flags =
	${esp32_base.build_flags}
	${stage_h2.build_flags}
	-D HEISHA_HOSTNAME='"HeishaMon32_h2"'
upload_protocol = ${ota32_defaults_h2.upload_protocol}
upload_port = ${ota32_defaults_h2.upload_port}
upload_flags = ${ota32_defaults_h2.upload_flags}


; ============================================================================
; 6. ERSTSETUP - Flash per USB
;    Der erste Flash eines Boards ist zwingend ueber USB noetig: die Original-
;    Firmware bringt eine andere Partitionstabelle mit, die per OTA nicht
;    getauscht werden kann. Danach immer ueber die *_ota-Envs flashen.
; ============================================================================

; Erstflash Stufe 1 - identischer Build wie _h1_ota
[env:heishamon_esp32_h1_usb]
extends = esp32_base
build_flags =
	${esp32_base.build_flags}
	${stage_h1.build_flags}
	-D HEISHA_HOSTNAME='"HeishaMon32_h1"'
upload_protocol = ${usb32_defaults.upload_protocol}
upload_port = ${usb32_defaults.upload_port}

; Erstflash Stufe 2 - identischer Build wie _h2_ota
[env:heishamon_esp32_h2_usb]
extends = esp32_base
build_flags =
	${esp32_base.build_flags}
	${stage_h2.build_flags}
	-D HEISHA_HOSTNAME='"HeishaMon32_h2"'
upload_protocol = ${usb32_defaults.upload_protocol}
upload_port = ${usb32_defaults.upload_port}


; ============================================================================
; 7. TEST - Geraete mit eigenem MQTT-Prefix, nie am produktiven Pfad
;    Seit dem Wegfall des D1-mini-Pruefstands wird dafuer ein Backup-Board
;    ausgeliehen; der Ablauf mit seiner sicherheitskritischen Reihenfolge steht
;    in Vorhaben-Nur-ESP32-Pfad.md Abschnitt 4 und in test/README.md.
; ============================================================================

; ESP32-Testgeraet ueber USB
[env:heishamon_esp32_usb]
extends = esp32_base
build_flags =
	${esp32_base.build_flags}
	${stage_test_esp32.build_flags}
	-D HEISHA_HOSTNAME='"HeishaMon32"'
upload_protocol = ${usb32_defaults.upload_protocol}
upload_port = ${usb32_defaults.upload_port}

; Dasselbe Testgeraet per OTA - fuer Updates, wenn es an der WP haengt
; (Erreichbarkeit ueber mDNS-Namen, unabhaengig von der DHCP-IP)
[env:heishamon_esp32_ota]
extends = esp32_base
build_flags =
	${esp32_base.build_flags}
	${stage_test_esp32.build_flags}
	-D HEISHA_HOSTNAME='"HeishaMon32"'
upload_protocol = ${ota32_defaults_test.upload_protocol}
upload_port = ${ota32_defaults_test.upload_port}
upload_flags = ${ota32_defaults_test.upload_flags}
