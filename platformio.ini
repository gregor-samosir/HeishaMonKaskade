; ============================================================================
; HeishaMon Kaskade - PlatformIO Projektkonfiguration
;
; Aufbau dieser Datei:
;   1. Projekt-Grundeinstellungen  [platformio]
;   2. Gemeinsame Basis aller Envs [env]
;   3. Bausteine: Board-Basis      [esp8266_base] [esp32_base]
;   4. Bausteine: Stufen-Identitaet[stage_h1] [stage_h2] [stage_test]
;   5. PRODUKTIV  (Update per OTA) *_h1_ota / *_h2_ota
;   6. ERSTSETUP  (Flash per USB)  *_usb
;   7. TEST       (Pruefstand)     *_test, heishamon_esp32_usb/_ota
;
; Geraetespezifische Ports und IP-Adressen stehen NICHT hier, sondern in
; platformio_user_env.ini (nicht in git, Vorlage: platformio_user_env_sample.ini).
; Diese Datei referenziert sie nur ueber ${usb_defaults.*}, ${ota_defaults_*.*},
; ${usb32_defaults.*} und ${ota32_defaults_*.*}.
;
; Doku: https://docs.platformio.org/page/projectconf.html
; ============================================================================


; ----------------------------------------------------------------------------
; 1. Projekt-Grundeinstellungen
; ----------------------------------------------------------------------------
[platformio]
src_dir = src
build_dir = .pioenvs
build_cache_dir = .cache
default_envs = d1_mini_h1_ota
extra_configs = platformio_user_env.ini


; ----------------------------------------------------------------------------
; 2. Gemeinsame Basis aller Envs
;    Nur das, was auf ESP8266 UND ESP32 gleich ist. Alles Board-Abhaengige
;    (platform, board, build_flags, flash_mode) steht in den Board-Basen
;    unter Punkt 3 - so gibt es keine stillen Ueberschreibungen.
; ----------------------------------------------------------------------------
[env]
framework = arduino
monitor_speed = 115200
build_unflags = -Wall
board_build.filesystem = littlefs
extra_scripts = piotools/name-firmware.py
check_tool = clangtidy
check_flags = clangtidy: --checks=-*,cert-*,clang-analyzer-* --fix
lib_deps =
	knolleary/PubSubClient@^2.8
	; bewusst 6.x: ArduinoJson 7 ist fuer den ESP8266 nicht empfohlen (Footprint)
	bblanchon/ArduinoJson@^6.21.5
	jandrassy/TelnetStream@^1.2.1
	paulstoffregen/Time@^1.6
	tzapu/WiFiManager@^2.0.17
	sstaub/Ticker


; ----------------------------------------------------------------------------
; 3. Bausteine: Board-Basis
;    Jedes Env erbt genau eine davon per "extends".
; ----------------------------------------------------------------------------

; D1 mini (ESP8266) - urspruengliche Plattform, heute Rueckfallebene
[esp8266_base]
platform = espressif8266
board = d1_mini
board_build.flash_mode = dout
build_flags =
	-D NDEBUG
	-Wl,-Map,firmware.map
	-D SERIAL_BUFFER_SIZE=256
;	-D MMU_IRAM_SIZE=0x8000
;	-D MMU_ICACHE_SIZE=0x4000
;	-D MMU_SEC_HEAP=0x40108000
;	-D MMU_SEC_HEAP_SIZE=0x4000

; Offizielles HeishaMon-ESP32-S3-Board (WP an Serial1 RX18/TX17, USB-CDC-Konsole)
[esp32_base]
platform = espressif32
board = esp32-s3-devkitc-1
board_build.flash_mode = dio
; Board hat 4 MB Flash (nicht 8 wie die devkitc-1-Definition annimmt);
; min_spiffs: 2x 1,9 MB OTA-Slots + 192 KB LittleFS fuer config.json
board_upload.flash_size = 4MB
board_build.partitions = min_spiffs.csv
build_flags =
	-D NDEBUG
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D ARDUINO_USB_MODE=1


; ----------------------------------------------------------------------------
; 4. Bausteine: Stufen-Identitaet
;    MQTT-Prefix und Web-Titel der Kaskadenstufe - kein Code-Anpassen mehr beim
;    Wechsel zwischen H1 und H2. Ohne diese Flags greifen die Stufe-1-Fallbacks
;    aus Topics.cpp (gilt z. B. fuer d1_mini_usb).
;    Der Hostname steht bewusst NICHT hier: ESP8266- und ESP32-Board derselben
;    Stufe koennen parallel im Netz haengen und brauchen eindeutige Namen.
; ----------------------------------------------------------------------------

[stage_h1]
build_flags =
	-D HEISHA_MQTT_PREFIX='"panasonic_heat_pump"'
	-D HEISHA_STAGE_NAME='"Heisha Stufe 1"'

[stage_h2]
build_flags =
	-D HEISHA_MQTT_PREFIX='"panasonic_heat_pump2"'
	-D HEISHA_STAGE_NAME='"Heisha Stufe 2"'

; Testgeraete: eigenes Prefix ist PFLICHT, sonst sitzt der Pruefling auf dem
; LWT- und state-Pfad der produktiven WP1.
[stage_test_esp32]
build_flags =
	-D HEISHA_MQTT_PREFIX='"panasonic_heat_pump32"'
	-D HEISHA_STAGE_NAME='"Heisha ESP32 Test"'

[stage_test_esp8266]
build_flags =
	-D HEISHA_MQTT_PREFIX='"panasonic_heat_pump_test"'
	-D HEISHA_STAGE_NAME='"Heisha Pruefstand"'


; ============================================================================
; 5. PRODUKTIV - Update per OTA, Geraet haengt an der Waermepumpe
; ============================================================================

; ESP32-S3 als Stufe 1 an WP1 (ersetzt den D1 mini H1)
[env:heishamon_esp32_h1_ota]
extends = esp32_base
build_flags =
	${esp32_base.build_flags}
	${stage_h1.build_flags}
	-D HEISHA_HOSTNAME='"HeishaMon32_h1"'
upload_protocol = ${ota32_defaults_h1.upload_protocol}
upload_port = ${ota32_defaults_h1.upload_port}
upload_flags = ${ota32_defaults_h1.upload_flags}

; ESP32-S3 als Stufe 2 an WP2 (ersetzt den D1 mini H2)
[env:heishamon_esp32_h2_ota]
extends = esp32_base
build_flags =
	${esp32_base.build_flags}
	${stage_h2.build_flags}
	-D HEISHA_HOSTNAME='"HeishaMon32_h2"'
upload_protocol = ${ota32_defaults_h2.upload_protocol}
upload_port = ${ota32_defaults_h2.upload_port}
upload_flags = ${ota32_defaults_h2.upload_flags}

; D1 mini als Stufe 1 - Rueckfallebene
[env:d1_mini_h1_ota]
extends = esp8266_base
build_flags =
	${esp8266_base.build_flags}
	${stage_h1.build_flags}
	-D HEISHA_HOSTNAME='"HeishaMon"'
upload_protocol = ${ota_defaults_h1.upload_protocol}
upload_port = ${ota_defaults_h1.upload_port}
upload_flags = ${ota_defaults_h1.upload_flags}

; D1 mini als Stufe 2 - Rueckfallebene
[env:d1_mini_h2_ota]
extends = esp8266_base
build_flags =
	${esp8266_base.build_flags}
	${stage_h2.build_flags}
	-D HEISHA_HOSTNAME='"HeishaMon2"'
upload_protocol = ${ota_defaults_h2.upload_protocol}
upload_port = ${ota_defaults_h2.upload_port}
upload_flags = ${ota_defaults_h2.upload_flags}


; ============================================================================
; 6. ERSTSETUP - Flash per USB
;    Beim ESP32 ist der erste Flash zwingend ueber USB noetig: die Original-
;    Firmware bringt eine andere Partitionstabelle mit, die per OTA nicht
;    getauscht werden kann. Danach immer ueber die *_ota-Envs flashen.
; ============================================================================

; Erstflash Stufe 1 auf dem ESP32-S3 - identischer Build wie _h1_ota
[env:heishamon_esp32_h1_usb]
extends = esp32_base
build_flags =
	${esp32_base.build_flags}
	${stage_h1.build_flags}
	-D HEISHA_HOSTNAME='"HeishaMon32_h1"'
upload_protocol = ${usb32_defaults.upload_protocol}
upload_port = ${usb32_defaults.upload_port}

; Erstflash Stufe 2 auf dem ESP32-S3 - identischer Build wie _h2_ota
[env:heishamon_esp32_h2_usb]
extends = esp32_base
build_flags =
	${esp32_base.build_flags}
	${stage_h2.build_flags}
	-D HEISHA_HOSTNAME='"HeishaMon32_h2"'
upload_protocol = ${usb32_defaults.upload_protocol}
upload_port = ${usb32_defaults.upload_port}

; Erstflash D1 mini ohne Stufen-Flags -> Stufe-1-Fallbacks aus dem Code
[env:d1_mini_usb]
extends = esp8266_base
upload_protocol = ${usb_defaults.upload_protocol}
upload_port = ${usb_defaults.upload_port}
upload_speed = ${usb_defaults.upload_speed}
upload_resetmethod = ${usb_defaults.upload_resetmethod}


; ============================================================================
; 7. TEST - Geraete mit eigenem MQTT-Prefix, nie am produktiven Pfad
; ============================================================================

; ESP32-Testgeraet ueber USB
[env:heishamon_esp32_usb]
extends = esp32_base
build_flags =
	${esp32_base.build_flags}
	${stage_test_esp32.build_flags}
	-D HEISHA_HOSTNAME='"HeishaMon32"'
upload_protocol = ${usb32_defaults.upload_protocol}
upload_port = ${usb32_defaults.upload_port}

; Dasselbe Testgeraet per OTA - fuer Updates, wenn es an der WP haengt
; (Erreichbarkeit ueber mDNS-Namen, unabhaengig von der DHCP-IP)
[env:heishamon_esp32_ota]
extends = esp32_base
build_flags =
	${esp32_base.build_flags}
	${stage_test_esp32.build_flags}
	-D HEISHA_HOSTNAME='"HeishaMon32"'
upload_protocol = ${ota32_defaults_test.upload_protocol}
upload_port = ${ota32_defaults_test.upload_port}
upload_flags = ${ota32_defaults_test.upload_flags}

; Pruefstand auf dem D1 mini, OHNE Waermepumpe angeschlossen. Dient nur dazu,
; das gesendete Telegramm im Hexlog anzuschauen (der Sendepfad braucht keine
; Gegenstelle).
[env:d1_mini_test]
extends = esp8266_base
build_flags =
	${esp8266_base.build_flags}
	${stage_test_esp8266.build_flags}
	-D HEISHA_HOSTNAME='"HeishaMonTest"'
upload_protocol = ${usb_defaults.upload_protocol}
upload_port = ${usb_defaults.upload_port}
upload_speed = ${usb_defaults.upload_speed}
upload_resetmethod = ${usb_defaults.upload_resetmethod}
